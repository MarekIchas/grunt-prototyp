<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0806">
<meta name="mobile-web-app-capable" content="yes">
<title>GRUNT! – prototyp rdzenia</title>
<style>
:root{--acc:#ffb020;--acc2:#7ee05a;--txt:#fff4e0}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--txt);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#game{position:relative;height:100%;width:min(100vw,62vh);margin:0 auto;overflow:hidden;background:#000}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 12px 14px;background:linear-gradient(#000b,#0000);pointer-events:none;font-weight:800;text-shadow:0 2px 0 #000a;letter-spacing:.5px}
.row{display:flex;justify-content:space-between;align-items:center}
#money{font-size:22px;color:#ffe27a}
#depth{font-size:20px}
.lbl{font-size:11px;opacity:.9;margin-top:6px}
.bar{height:8px;background:#0009;border-radius:4px;overflow:hidden;margin-top:3px;width:48%}
.bar i{display:block;height:100%;width:0}
.fuel i{background:linear-gradient(90deg,#ffb020,#ffd84a)}.hp i{background:#ff5a4a}.xp i{background:#7ee05a}
#btns{position:absolute;right:10px;top:calc(env(safe-area-inset-top) + 46px);display:flex;flex-direction:column;gap:8px}
.ib{width:46px;height:46px;border-radius:12px;border:2px solid #fff3;background:#000a;color:#fff;font-weight:900;font-size:15px}
.ib.sos{background:#b3261e;border-color:#ff8a80}
#toast{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%);padding:9px 14px;border-radius:10px;background:#000c;font-weight:800;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center;max-width:86%}
#toast.on{opacity:1}
#hint{position:absolute;left:0;right:0;bottom:16%;text-align:center;font-weight:800;font-size:17px;pointer-events:none;opacity:0;transition:opacity .5s;text-shadow:0 2px 0 #000}
#hint.on{opacity:1}
#panel{position:absolute;inset:0;background:linear-gradient(#0b0806f0,#1c140ef8);overflow-y:auto;padding:calc(env(safe-area-inset-top) + 16px) 14px 28px;display:flex;flex-direction:column;gap:12px;touch-action:pan-y}
#panel.glass{background:#0b0806c8;justify-content:center}
#panel.hidden{display:none}
h1,h2,h3{margin:0}
h1{font-size:30px;color:var(--acc);letter-spacing:2px}
h2{font-size:22px}
h3{font-size:15px;opacity:.85;margin-bottom:4px}
.card{background:#ffffff0d;border:1px solid #ffffff1a;border-radius:14px;padding:12px}
.big{font-size:26px;font-weight:900;color:#ffe27a}
.upg{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #ffffff12}
.upg:last-child{border-bottom:0}
.upg .ic{font-size:24px;width:34px;text-align:center}
.upg .nm{flex:1;min-width:0}.upg .nm b{display:block}.upg .nm small{opacity:.75}
.buy{min-width:88px;padding:10px 8px;border-radius:10px;border:0;background:var(--acc);color:#2a1700;font-weight:900;font-size:14px}
.buy:disabled{background:#4a4038;color:#9a8f85}
.go{padding:16px;border-radius:14px;border:0;background:var(--acc2);color:#132a07;font-weight:900;font-size:22px;letter-spacing:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chip{padding:3px 9px;border-radius:999px;background:#ffffff16;font-size:13px}
.elev{display:flex;flex-wrap:wrap;gap:6px}
.sel-btn{padding:8px 11px;border-radius:10px;border:1px solid #ffffff2a;background:#ffffff10;color:#fff;font-weight:700}
.sel-btn.on{background:var(--acc);color:#2a1700}
.perks{display:flex;flex-direction:column;gap:10px}
.perk{text-align:left;padding:14px;border-radius:14px;border:2px solid #7ee05a66;background:#11240bdd;color:#fff;font-size:14px}
.perk b{font-size:17px;color:#b8ff9a;display:block;margin-bottom:2px}
.muted{opacity:.7;font-size:13px}
</style>
</head>
<body>
<div id="game">
  <canvas id="cv"></canvas>
  <div id="hud">
    <div class="row"><div id="depth">0 m</div><div id="money">$0</div></div>
    <div class="lbl" id="fuelt">PALIWO</div><div class="bar fuel"><i id="fuelb"></i></div>
    <div class="lbl">KADŁUB</div><div class="bar hp"><i id="hpb"></i></div>
    <div class="lbl" id="lvl">WIERTŁO LV 0</div><div class="bar xp"><i id="xpb"></i></div>
  </div>
  <div id="btns"><button class="ib" id="pauseBtn" aria-label="Pauza">II</button><button class="ib sos" id="sosBtn" aria-label="Wezwij wyciągarkę">SOS</button></div>
  <div id="toast"></div>
  <div id="hint">Przeciągnij palcem w dowolnym miejscu,<br>żeby sterować wiertłem ⬇</div>
  <div id="panel" class="hidden"></div>
</div>
<script>
(() => {
'use strict';
// ====================== STAŁE ŚWIATA ======================
const W = 64, H = 2720, SURF = 12, MPC = 0.5, VIEW_W = 40, RIG_X = W / 2;

// ====================== MATERIAŁY ======================
// kind: 0 pusty, 1 stały, 2 sypki (piasek), 3 ciecz
const MAT = [];
function def(name, col, kind, tier, hp, o = {}) { MAT.push(Object.assign({ name, col, kind, tier, hp, val: 0, xp: 0, ore: false }, o)); return MAT.length - 1; }
const AIR = def('Pustka', [38, 26, 19], 0, 0, 0);
const DIRT = def('Ziemia', [146, 96, 58], 1, 1, 1);
const CLAY = def('Glina', [168, 108, 76], 1, 1, 1.6);
const SAND = def('Piasek', [214, 184, 118], 2, 1, 0.5);
const STONE = def('Kamień', [118, 116, 120], 1, 2, 3);
const GRANITE = def('Granit', [150, 124, 128], 1, 3, 5);
const BASALT = def('Bazalt', [66, 63, 76], 1, 4, 8);
const CRYST = def('Skała krystaliczna', [88, 76, 130], 1, 5, 12);
const OBSID = def('Obsydian', [44, 26, 64], 1, 4, 10);
const BEDROCK = def('Skała macierzysta', [22, 20, 24], 1, 99, 1e9);
const WATER = def('Woda', [48, 108, 228], 3, 0, 0);
const LAVA = def('Lawa', [255, 112, 24], 3, 0, 0);
const COAL = def('Węgiel', [40, 38, 40], 1, 1, 1.4, { val: 1, xp: 1, ore: true });
const COPPER = def('Miedź', [222, 126, 58], 1, 1, 2, { val: 3, xp: 2, ore: true });
const IRON = def('Żelazo', [205, 180, 166], 1, 2, 3.5, { val: 8, xp: 3, ore: true });
const SILVER = def('Srebro', [226, 232, 244], 1, 2, 4, { val: 18, xp: 4, ore: true });
const GOLD = def('Złoto', [255, 206, 38], 1, 3, 6, { val: 45, xp: 6, ore: true });
const RUBY = def('Rubin', [230, 30, 72], 1, 4, 9, { val: 110, xp: 9, ore: true });
const EMERALD = def('Szmaragd', [40, 220, 112], 1, 4, 10, { val: 180, xp: 12, ore: true });
const DIAMOND = def('Diament', [160, 244, 255], 1, 5, 14, { val: 420, xp: 18, ore: true });
const FUEL = def('Kanister', [240, 200, 40], 1, 1, 1);
const CHEST = def('Skrzynia', [196, 134, 44], 1, 1, 2);
const KIND = new Uint8Array(MAT.map(m => m.kind));
const CSS = MAT.map(m => `rgb(${m.col[0]},${m.col[1]},${m.col[2]})`);

const LAYERS = [
  { name: 'Gleba', to: 60, base: DIRT, alt: CLAY, altT: .60, ores: [[COAL, 5], [COPPER, 4]], cave: .66, lava: 0 },
  { name: 'Piaski', to: 160, base: DIRT, alt: SAND, altT: .56, ores: [[COPPER, 4], [IRON, 4], [COAL, 2]], cave: .65, lava: 0 },
  { name: 'Skała', to: 320, base: STONE, alt: DIRT, altT: .68, ores: [[IRON, 4], [SILVER, 3], [GOLD, 1]], cave: .64, lava: 0 },
  { name: 'Granit', to: 550, base: GRANITE, alt: STONE, altT: .64, ores: [[SILVER, 3], [GOLD, 3], [RUBY, 1]], cave: .64, lava: .45 },
  { name: 'Magma', to: 850, base: BASALT, alt: GRANITE, altT: .66, ores: [[GOLD, 2], [RUBY, 3], [EMERALD, 2]], cave: .62, lava: .8 },
  { name: 'Kryształy', to: 99999, base: CRYST, alt: BASALT, altT: .64, ores: [[EMERALD, 3], [DIAMOND, 2], [RUBY, 1]], cave: .63, lava: .5 },
];
const layerAt = d => { for (const L of LAYERS) if (d < L.to) return L; return LAYERS[LAYERS.length - 1]; };

// ====================== ULEPSZENIA I PERKI ======================
const UPG = [
  { id: 'drill', ic: '⛏️', n: 'Wiertło', max: 10, base: 30, g: 1.7, d: l => `moc ${(4 * 1.3 ** l).toFixed(1)} · klasa ${1 + Math.floor((l + 1) / 2)}` },
  { id: 'engine', ic: '⚙️', n: 'Silnik', max: 10, base: 20, g: 1.6, d: l => `prędkość ${(6 + .9 * l).toFixed(1)}` },
  { id: 'tank', ic: '⛽', n: 'Zbiornik', max: 12, base: 25, g: 1.55, d: l => `paliwo ${25 + 9 * l} s` },
  { id: 'hull', ic: '🛡️', n: 'Kadłub', max: 10, base: 40, g: 1.65, d: l => `HP ${100 + 35 * l} · żar −${Math.round(Math.min(.6, .06 * l) * 100)}%` },
  { id: 'lamp', ic: '🔦', n: 'Reflektor', max: 8, base: 15, g: 1.6, d: l => `zasięg ${8 + 2 * l}` },
  { id: 'trade', ic: '💰', n: 'Handel', max: 10, base: 60, g: 1.8, d: l => `wartość rudy ×${(1 + .15 * l).toFixed(2)}` },
];
const PERKS = [
  { id: 'wide', n: 'Szeroki frez', d: 'Promień wiertła +22%', max: 4 },
  { id: 'turbo', n: 'Turbo', d: 'Prędkość +18%', max: 5 },
  { id: 'carbide', n: 'Węgliki spiekane', d: 'Moc kopania +30%', max: 5 },
  { id: 'eco', n: 'Oszczędny silnik', d: 'Spalanie paliwa −15%', max: 4 },
  { id: 'gold', n: 'Gorączka złota', d: 'Wartość rudy +25%', max: 5 },
  { id: 'cool', n: 'Chłodnica', d: 'Obrażenia od lawy −35%', max: 3 },
  { id: 'light', n: 'Szperacz', d: 'Zasięg światła +3', max: 3 },
  { id: 'chain', n: 'Reakcja łańcuchowa', d: 'Rozbita ruda kruszy sąsiednią rudę tego samego typu', max: 1 },
  { id: 'blast', n: 'Ładunek sejsmiczny', d: 'Co kilka sekund eksplozja wokół wiertła', max: 3 },
  { id: 'sonar', n: 'Sonar', d: 'Ruda widoczna w ciemności', max: 2 },
  { id: 'fuel', n: 'Kanister', d: 'Od razu +35% paliwa', max: 99, instant: true },
  { id: 'heal', n: 'Spawarka', d: 'Od razu naprawia 60% kadłuba', max: 99, instant: true },
];
const xpNeed = lv => Math.round(10 * 1.5 ** lv);

// ====================== ZAPIS ======================
const SAVE_KEY = 'grunt_save_v1', WORLD_KEY = 'grunt_world_v1';
let save = { money: 0, lv: { drill: 0, engine: 0, tank: 0, hull: 0, lamp: 0, trade: 0 }, best: 0, runs: 0, earned: 0, seed: (Math.random() * 1e9) | 0, startDepth: 0, sound: true, vib: true };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s) save = Object.assign(save, s, { lv: Object.assign(save.lv, s.lv || {}) }); } catch (e) {}

// ====================== SZUM / GENERATOR ======================
function hash(x, y, s) { let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s | 0, 982451653)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function vnoise(x, y, s) { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf); const a = hash(xi, yi, s), b = hash(xi + 1, yi, s), c = hash(xi, yi + 1, s), d = hash(xi + 1, yi + 1, s); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; }
function fbm(x, y, s, o) { let t = 0, a = .5, f = 1, n = 0; for (let k = 0; k < o; k++) { t += a * vnoise(x * f, y * f, s + k * 101); n += a; a *= .5; f *= 2; } return t / n; }
function pickOre(list, r) { let tot = 0; for (const [, w] of list) tot += w; r *= tot; for (const [m, w] of list) { if (r < w) return m; r -= w; } return list[0][0]; }

const world = new Uint8Array(W * H), dmg = new Float32Array(W * H), stamp = new Uint16Array(W * H), seen = new Uint8Array(W * H);
function generate(seed) {
  seen.fill(0); dmg.fill(0);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    let m = AIR;
    if (y < SURF) m = AIR;
    else if (x === 0 || x === W - 1 || y >= H - 3) m = BEDROCK;
    else {
      const d = (y - SURF) * MPC;
      const L = layerAt(Math.max(0, d + (fbm(x * .11, y * .11, seed + 3, 2) - .5) * 14));
      m = fbm(x * .09, y * .09, seed + 1, 3) > L.altT ? L.alt : L.base;
      const cave = d > 6 && fbm(x * .07, y * .05, seed + 7, 3) > L.cave;
      if (cave) {
        const lq = fbm(x * .035, y * .035, seed + 13, 2);
        m = lq > .58 ? ((L.lava > 0 && fbm(x * .02, y * .02, seed + 17, 2) < L.lava) ? LAVA : WATER) : AIR;
      } else if (vnoise(x * .28, y * .28, seed + 21) > .8 - Math.min(.05, d / 5000)) {
        m = pickOre(L.ores, hash(Math.floor(x / 6), Math.floor(y / 6), seed + 29));
      } else {
        const r = hash(x, y, seed + 31);
        if (d > 8 && r < .0024) m = FUEL;
        else if (d > 15 && r > .99955) m = CHEST;
      }
    }
    world[y * W + x] = m;
  }
}
function encodeWorld() {
  const out = []; let i = 0;
  while (i < world.length) { const m = world[i]; let n = 1; while (i + n < world.length && world[i + n] === m && n < 255) n++; out.push(m, n); i += n; }
  const u = new Uint8Array(out); let s = '';
  for (let k = 0; k < u.length; k += 0x8000) s += String.fromCharCode.apply(null, u.subarray(k, k + 0x8000));
  return btoa(s);
}
function decodeWorld(b64) {
  const s = atob(b64); let p = 0;
  for (let k = 0; k + 1 < s.length; k += 2) { const m = s.charCodeAt(k), n = s.charCodeAt(k + 1); if (m >= MAT.length || p + n > world.length) return false; world.fill(m, p, p + n); p += n; }
  return p === world.length;
}
let noSave = false;
function persist() { if (noSave) return; try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); localStorage.setItem(WORLD_KEY, encodeWorld()); } catch (e) {} }

// ====================== DŹWIĘK / WIBRACJE ======================
const AU = { ctx: null, g: null, o: null };
function audioInit() {
  if (AU.ctx) return;
  try {
    const c = new (window.AudioContext || window.webkitAudioContext)();
    const o = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain();
    o.type = 'sawtooth'; o.frequency.value = 55; f.type = 'lowpass'; f.frequency.value = 700; g.gain.value = 0;
    o.connect(f); f.connect(g); g.connect(c.destination); o.start();
    Object.assign(AU, { ctx: c, g, o });
  } catch (e) {}
}
function drillSound(level) { if (!AU.ctx) return; const t = AU.ctx.currentTime; AU.g.gain.setTargetAtTime(save.sound ? level * .045 : 0, t, .06); AU.o.frequency.setTargetAtTime(48 + level * 42, t, .08); }
function blip(freq, dur = .07, vol = .06) {
  if (!AU.ctx || !save.sound) return;
  const c = AU.ctx, o = c.createOscillator(), g = c.createGain(); o.type = 'square'; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, c.currentTime); g.gain.exponentialRampToValueAtTime(.0001, c.currentTime + dur);
  o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + dur);
}
const vib = ms => { if (save.vib && navigator.vibrate) try { navigator.vibrate(ms); } catch (e) {} };

// ====================== STAN GRY ======================
const $ = id => document.getElementById(id);
const canvas = $('cv'), ctx = canvas.getContext('2d'), panel = $('panel');
const buf = document.createElement('canvas'), bctx = buf.getContext('2d');
let img, cs = 10, VIEW_H = 70, dpr = 1;
let state = 'shop', run = null, lastSummary = null, RS = null, tick = 1, shake = 0, now = 0;
const P = { x: RIG_X, y: SURF - 2.5, ang: 0, fuel: 0, hp: 0 };
const cam = { x: RIG_X - VIEW_W / 2, y: 0 };
const parts = [], pops = [], rings = [];
const input = { active: false, ax: 0, ay: 0, cx: 0, cy: 0, x: 0, y: 0 }, keys = new Set();

function computeStats() {
  const l = save.lv, p = (run && run.perks) || {};
  const s = { power: 4 * 1.3 ** l.drill, tier: 1 + Math.floor((l.drill + 1) / 2), speed: 6 + .9 * l.engine, fuel: 25 + 9 * l.tank, hp: 100 + 35 * l.hull, heat: Math.min(.6, .06 * l.hull), light: 8 + 2 * l.lamp, value: 1 + .15 * l.trade, r: 1.8, burn: 1 };
  s.r *= 1.22 ** (p.wide || 0); s.speed *= 1.18 ** (p.turbo || 0); s.power *= 1.3 ** (p.carbide || 0); s.burn *= .85 ** (p.eco || 0);
  s.value *= 1 + .25 * (p.gold || 0); s.heat = 1 - (1 - s.heat) * .65 ** (p.cool || 0); s.light += 3 * (p.light || 0);
  s.chain = !!p.chain; s.blast = p.blast || 0; s.sonar = p.sonar || 0;
  return s;
}

// ====================== GEOMETRIA ======================
function sqDistToCell(px, py, cx, cy) { const dx = Math.max(cx - px, 0, px - (cx + 1)), dy = Math.max(cy - py, 0, py - (cy + 1)); return dx * dx + dy * dy; }
function isSolidAt(x, y) { if (x < 0 || x >= W || y < 0 || y >= H) return true; const k = KIND[world[y * W + x]]; return k === 1 || k === 2; }
function pen(px, py) {
  const r = RS.r * .82, r2 = r * r; let s = 0;
  for (let y = Math.floor(py - r); y <= Math.floor(py + r); y++) for (let x = Math.floor(px - r); x <= Math.floor(px + r); x++) {
    if (!isSolidAt(x, y)) continue; const d2 = sqDistToCell(px, py, x, y); if (d2 < r2) s += r - Math.sqrt(d2);
  }
  return s;
}
function tryMove(dx, dy) {
  const steps = Math.max(1, Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)) / .2)), sx = dx / steps, sy = dy / steps; let moved = false;
  for (let k = 0; k < steps; k++) {
    const cur = pen(P.x, P.y), ok = (x, y) => { const p = pen(x, y); return p <= 1e-6 || p < cur - 1e-4; };
    if (ok(P.x + sx, P.y + sy)) { P.x += sx; P.y += sy; moved = true; }
    else if (sx && ok(P.x + sx, P.y)) { P.x += sx; moved = true; }
    else if (sy && ok(P.x, P.y + sy)) { P.y += sy; moved = true; }
    else break;
  }
  return moved;
}
function carve(cx, cy, r) {
  for (let y = Math.floor(cy - r - 3); y <= cy + r + 3; y++) for (let x = 1; x < W - 1; x++) {
    if (y < SURF || y >= H - 3) continue; const i = y * W + x, d = Math.hypot(x + .5 - cx, y + .5 - cy);
    if (d < r || (d < r + 3 && world[i] === LAVA)) { world[i] = AIR; dmg[i] = 0; }
  }
}

// ====================== SYMULACJA PIASKU I CIECZY ======================
let occOn = false, occR2 = 0, protR2 = 0;
const occ = (x, y) => occOn && sqDistToCell(P.x, P.y, x, y) < occR2;
function swap(i, j) { const t = world[i]; world[i] = world[j]; world[j] = t; stamp[i] = stamp[j] = tick; dmg[i] = dmg[j] = 0; }
function simulate() {
  tick = (tick + 1) & 0xffff || 1;
  occOn = state === 'run'; occR2 = (RS.r * .95) ** 2; protR2 = (RS.r + 3) ** 2;
  const y0 = Math.max(SURF - 2, Math.floor(cam.y) - 40), y1 = Math.min(H - 4, Math.floor(cam.y) + VIEW_H + 40), ltr = tick & 1;
  for (let y = y1; y >= y0; y--) for (let n = 1; n < W - 1; n++) {
    const x = ltr ? n : W - 1 - n, i = y * W + x, m = world[i], k = KIND[m];
    if (k < 2 || stamp[i] === tick) continue;
    if (k === 2) stepPowder(x, y, i);
    else if (m === WATER) stepLiquid(x, y, i, 3);
    else stepLava(x, y, i);
  }
}
function stepPowder(x, y, i) {
  const b = i + W, mb = world[b];
  if ((mb === AIR || KIND[mb] === 3) && !occ(x, y + 1)) { swap(i, b); return; }
  const dl = Math.random() < .5 ? -1 : 1;
  for (const dx of [dl, -dl]) if (world[i + dx] === AIR && world[b + dx] === AIR && !occ(x + dx, y + 1)) { swap(i, b + dx); return; }
}
function stepLiquid(x, y, i, disp) {
  const b = i + W;
  if (world[b] === AIR && !occ(x, y + 1)) { swap(i, b); return; }
  const dl = Math.random() < .5 ? -1 : 1;

  const S = (wx, wy) => [(wx - cam.x) * cs + ox, (wy - cam.y) * cs + oy];
  drawRig(S);
  if (state === 'winch' || state === 'shop') { const [ax, ay] = S(RIG_X, SURF - 9), [bx, by] = S(P.x, P.y); ctx.strokeStyle = '#d9d2c5'; ctx.lineWidth = Math.max(1.5, cs * .18); ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke(); }
  for (const q of rings) { const [x, y] = S(q.x, q.y); ctx.strokeStyle = `rgba(255,220,120,${q.life * 2.5})`; ctx.lineWidth = cs * .5; ctx.beginPath(); ctx.arc(x, y, q.r * cs * (1.3 - q.life), 0, 7); ctx.stroke(); }
  const [dx, dy] = S(P.x, P.y); drawDrill(dx, dy, RS.r * cs);
  for (const q of parts) { const [x, y] = S(q.x, q.y); ctx.fillStyle = q.col; ctx.globalAlpha = Math.min(1, q.life * 2); ctx.fillRect(x - q.s * cs / 2, y - q.s * cs / 2, q.s * cs, q.s * cs); }
  ctx.globalAlpha = 1; ctx.textAlign = 'center'; ctx.font = `900 ${Math.round(cs * 1.25)}px system-ui,sans-serif`;
  for (const q of pops) { const [x, y] = S(q.x, q.y); ctx.globalAlpha = Math.min(1, q.life * 1.6); ctx.fillStyle = '#000a'; ctx.fillText(q.text, x + 2, y + 2); ctx.fillStyle = q.col; ctx.fillText(q.text, x, y); }
  ctx.globalAlpha = 1;
  if (input.active && state === 'run') {
    const rc = canvas.getBoundingClientRect(), ax = (input.ax - rc.left) * dpr, ay = (input.ay - rc.top) * dpr;
    ctx.strokeStyle = '#ffffff55'; ctx.lineWidth = 3 * dpr; ctx.beginPath(); ctx.arc(ax, ay, JOY_R * dpr, 0, 7); ctx.stroke();
    ctx.fillStyle = '#ffffff66'; ctx.beginPath(); ctx.arc(ax + input.x * JOY_R * dpr, ay + input.y * JOY_R * dpr, 16 * dpr, 0, 7); ctx.fill();
  }
}
function drawRig(S) {
  const [hx, hy] = S(RIG_X - 15, SURF - 6);
  ctx.fillStyle = '#5b3b24'; ctx.fillRect(hx, hy, 9 * cs, 6 * cs);
  ctx.fillStyle = '#b8322a'; ctx.beginPath(); ctx.moveTo(hx - cs * .6, hy); ctx.lineTo(hx + 4.5 * cs, hy - 3 * cs); ctx.lineTo(hx + 9.6 * cs, hy); ctx.fill();
  ctx.fillStyle = '#ffd36a'; ctx.fillRect(hx + 1 * cs, hy + 2 * cs, 2 * cs, 2 * cs); ctx.fillStyle = '#2a1a10'; ctx.fillRect(hx + 5.5 * cs, hy + 2.5 * cs, 2 * cs, 3.5 * cs);
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = `900 ${Math.round(cs * .9)}px system-ui,sans-serif`; ctx.fillText('GRUNT Co.', hx + 4.5 * cs, hy + 1.3 * cs);
  const [tx, ty] = S(RIG_X, SURF - 9), [lx, by] = S(RIG_X - 3.5, SURF), [rx] = S(RIG_X + 3.5, SURF);
  ctx.strokeStyle = '#e0a030'; ctx.lineWidth = cs * .45; ctx.beginPath(); ctx.moveTo(lx, by); ctx.lineTo(tx, ty); ctx.lineTo(rx, by);
  ctx.moveTo(lx + (tx - lx) * .45, by + (ty - by) * .45); ctx.lineTo(rx + (tx - rx) * .45, by + (ty - by) * .45); ctx.stroke();
  ctx.fillStyle = '#333'; ctx.beginPath(); ctx.arc(tx, ty, cs * .7, 0, 7); ctx.fill();
}
function drawDrill(x, y, r) {
  const col = ['#c9a227', '#d98e2b', '#e0612f', '#c23b6a', '#7a5cd6', '#2fb7c9', '#7ee05a'][Math.min(6, RS.tier - 1)];
  ctx.save(); ctx.translate(x, y); ctx.rotate(P.ang);
  ctx.fillStyle = '#d6d6d6'; ctx.strokeStyle = '#1b1b1b'; ctx.lineWidth = Math.max(1, r * .06);
  for (let k = 0; k < 8; k++) { ctx.rotate(Math.PI / 4); ctx.beginPath(); ctx.moveTo(r * .62, -r * .3); ctx.lineTo(r * 1.1, 0); ctx.lineTo(r * .62, r * .3); ctx.closePath(); ctx.fill(); ctx.stroke(); }
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(0, 0, r * .74, 0, 7); ctx.fill();
  ctx.fillStyle = '#1b1b1b'; ctx.beginPath(); ctx.arc(0, 0, r * .36, 0, 7); ctx.fill();
  ctx.fillStyle = '#ffe08a'; ctx.fillRect(-r * .12, -r * .12, r * .24, r * .24);

}
function updateFx(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const q = parts[i];
    if (q.home && state === 'run') { const ax = P.x - q.x, ay = P.y - q.y, l = Math.hypot(ax, ay) || 1; q.vx += ax / l * 70 * dt; q.vy += ay / l * 70 * dt; if (l < .6) q.life = 0; }
    else q.vy += q.g * dt;
    q.x += q.vx * dt; q.y += q.vy * dt; q.life -= dt; if (q.life <= 0) parts.splice(i, 1);
  }
  for (let i = pops.length - 1; i >= 0; i--) { const q = pops[i]; q.y -= 1.6 * dt; q.life -= dt; if (q.life <= 0) pops.splice(i, 1); }
  for (let i = rings.length - 1; i >= 0; i--) { rings[i].life -= dt; if (rings[i].life <= 0) rings.splice(i, 1); }

  if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('toast').classList.remove('on'); }
}
const hudCache = {};
function setHud(id, prop, val) { const k = id + prop; if (hudCache[k] === val) return; hudCache[k] = val; if (prop === 't') $(id).textContent = val; else $(id).style.width = val; }
function updateHUD() {
  const inRun = state === 'run' || state === 'perk' || state === 'pause' || state === 'winch';
  $('hud').style.display = inRun ? '' : 'none'; $('btns').style.display = state === 'run' ? '' : 'none';
  if (!inRun || !run) return;
  setHud('depth', 't', Math.max(0, Math.floor((P.y - SURF) * MPC)) + ' m');
  setHud('money', 't', fmt(save.money + run.pending));
  setHud('fuelt', 't', 'PALIWO ' + Math.max(0, Math.ceil(P.fuel / RS.burn)) + ' s');
  setHud('fuelb', 'w', Math.max(0, Math.min(100, P.fuel / RS.fuel * 100)) + '%');
  setHud('hpb', 'w', Math.max(0, P.hp / RS.hp * 100) + '%');
  setHud('lvl', 't', 'WIERTŁO LV ' + run.lv);
  setHud('xpb', 'w', Math.min(100, run.exp / run.next * 100) + '%');
}

// ====================== PĘTLA ======================
let last = performance.now(), simAcc = 0;
function frame(t) {
  const dt = Math.min(.05, (t - last) / 1000); last = t; now = t;
  if (state === 'run') updateRun(dt);
  else if (state === 'winch') updateWinch(dt);
  if (state === 'run' || state === 'winch' || state === 'shop') { simAcc += dt; let n = 0; while (simAcc >= 1 / 30 && n++ < 3) { simAcc -= 1 / 30; simulate(); } if (n >= 3) simAcc = 0; }
  if (state !== 'perk' && state !== 'pause') updateFx(dt);
  updateCamera(dt); render(); updateHUD();
  requestAnimationFrame(frame);
}

// ====================== START ======================
const saved = localStorage.getItem(WORLD_KEY);
if (!saved || !decodeWorld(saved)) generate(save.seed);
RS = computeStats(); resize();
cam.y = 0; cam.x = Math.max(0, Math.min(W - VIEW_W, RIG_X - VIEW_W / 2));
showShop();
window.__grunt = { get state() { return state; }, P, save, startRun, world, W, SURF, MAT, endRun };
requestAnimationFrame(frame);
})();
